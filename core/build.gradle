plugins { id 'com.android.library' }
android {
    compileSdk 34
    namespace 'com.wdesign.wiseiptv.core'
    defaultConfig { minSdk 21; targetSdk 34 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    api "androidx.appcompat:appcompat:1.7.0"
    api "androidx.media3:media3-exoplayer:1.3.1"
    api "androidx.media3:media3-exoplayer-hls:1.3.1"
    api "androidx.media3:media3-exoplayer-dash:1.3.1"
    api "androidx.media3:media3-datasource-okhttp:1.3.1"
    api "androidx.media3:media3-ui:1.3.1"
    api "androidx.media3:media3-common:1.3.1"
    api "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    api "com.squareup.okhttp3:okhttp:4.12.0"
    api "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    api "androidx.lifecycle:lifecycle-livedata:2.7.0"
	implementation "androidx.media3:media3-exoplayer-hls:1.3.1"
    implementation "androidx.media3:media3-datasource:1.3.1"
}
