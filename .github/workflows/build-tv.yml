name: Build Wise IPTV — TV APK

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
    build-tv:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download gradle-wrapper.jar
        run: |
          GRADLE_VERSION=8.6
          mkdir -p gradle/wrapper
          curl -sSfL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
               -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Ensure gradle-wrapper.properties
        run: |
          PROPS="gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$PROPS" ]; then
            cat > "$PROPS" <<'PROPSEOF'
            distributionBase=GRADLE_USER_HOME
            distributionPath=wrapper/dists
            distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
            zipStoreBase=GRADLE_USER_HOME
            zipStorePath=wrapper/dists
            PROPSEOF
          fi
      # ─── Build Debug avec logs complets ─────────────────────────
      - name: Build TV Debug APK
        run: |
          ./gradlew :tv:assembleDebug \
            --no-daemon \
            --stacktrace \
            --info \
            2>&1 | tee build-tv-debug.log
          echo "════════════ ERREURS DE COMPILATION ════════════"
          grep -E "^(e:|error:|FAILED|Exception|Caused by:|> Task|BUILD)" build-tv-debug.log \
            | grep -v "^> Task :.*UP-TO-DATE" \
            | grep -v "^> Task :.*SKIPPED" \
            | head -100 || echo "Aucune erreur détectée"
          echo "═════════════════════════════════════════════════"
          grep -q "BUILD SUCCESSFUL" build-tv-debug.log || exit 1

      - name: Show error report on failure
        if: failure()
        run: |
          echo "════════════ RAPPORT D'ERREURS COMPLET ════════════"
          grep -E "(error:|Error:|FAILED|Exception|Caused by:|\.java:[0-9]+)" build-tv-debug.log \
            | head -200
          echo ""
          echo "════════════ 50 DERNIÈRES LIGNES DU LOG ════════════"
          tail -50 build-tv-debug.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-tv-error-log-${{ github.run_number }}
          path: build-tv-debug.log
          retention-days: 7

      # ─── Build Release signé ─────────────────────────────────────
      - name: Sign & Build TV Release APK
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > tv/keystore.jks
          ./gradlew :tv:assembleRelease \
            --no-daemon \
            --stacktrace \
            --info \
            -Pandroid.injected.signing.store.file=tv/keystore.jks \
            -Pandroid.injected.signing.store.password=$STORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD \
            2>&1 | tee build-tv-release.log
          rm -f tv/keystore.jks
          grep -q "BUILD SUCCESSFUL" build-tv-release.log || exit 1

      - name: Show release error on failure
        if: failure()
        run: |
          grep -E "(error:|Error:|FAILED|Exception|Caused by:|\.java:[0-9]+)" build-tv-release.log 2>/dev/null | head -100 || true

      - name: Rename TV APKs
        run: |
          TAG="${{ github.ref_name }}"
          DEBUG=$(find tv/build/outputs/apk/debug   -name '*.apk' 2>/dev/null | head -1)
          RELEASE=$(find tv/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          [ -f "$DEBUG" ]   && cp "$DEBUG"   "WiseIPTV-TV-${TAG}-debug.apk"   || true
          [ -f "$RELEASE" ] && cp "$RELEASE" "WiseIPTV-TV-${TAG}-release.apk" || true
          ls -lh WiseIPTV-TV-*.apk || echo "Aucun APK trouvé"

      - name: Upload TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiseIPTV-TV-${{ github.ref_name }}
          path: 'WiseIPTV-TV-*.apk'
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release — TV
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'WiseIPTV-TV-*.apk'
          body: |
            ## Wise IPTV TV ${{ github.ref_name }}
            **APK Smart TV / Android TV Box**
            W Design — +240 555 445 514

            | Fichier | Usage |
            |---|---|
            | `*-debug.apk` | Tests & développement |
            | `*-release.apk` | Production (keystore requis) |

            ### Installation TV Box
            ```bash
            adb connect 192.168.1.XXX:5555
            adb install WiseIPTV-TV-${{ github.ref_name }}-debug.apk
            ```

            ### Secrets GitHub requis
            | Secret | Description |
            |---|---|
            | `ANDROID_KEYSTORE_BASE64` | Keystore encodé en base64 |
            | `ANDROID_KEY_ALIAS` | Alias de la clé |
            | `ANDROID_KEY_PASSWORD` | Mot de passe de la clé |
            | `ANDROID_STORE_PASSWORD` | Mot de passe du keystore |
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
