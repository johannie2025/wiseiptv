name: Build Wise IPTV — Mobile APK

on:
  push:
    tags: ['v*']
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1 : Compilation ───────────────────────────────────────────────────
  build-mobile:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Download gradle-wrapper.jar
        run: |
          GRADLE_VERSION=8.6
          mkdir -p gradle/wrapper
          curl -sSfL "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar" \
               -o gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Ensure gradle-wrapper.properties
        run: |
          PROPS="gradle/wrapper/gradle-wrapper.properties"
          if [ ! -f "$PROPS" ]; then
           cat > "$PROPS" <<'PROPSEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.6-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          PROPSEOF
          fi

      - name: Build Debug APK
        run: ./gradlew :mobile:assembleDebug

      - name: Build Release APK
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.keystore
          ./gradlew :mobile:assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEY_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Prepare APK Artifacts
        run: |
          TAG="${{ github.ref_name }}"
          [ -z "$TAG" ] && TAG="latest"
          DEBUG="mobile/build/outputs/apk/debug/mobile-debug.apk"
          RELEASE="mobile/build/outputs/apk/release/mobile-release.apk"
          [ -f "$DEBUG" ]   && cp "$DEBUG"   "WiseIPTV-Mobile-${TAG}-debug.apk"   || true
          [ -f "$RELEASE" ] && cp "$RELEASE" "WiseIPTV-Mobile-${TAG}-release.apk" || true
          ls -lh WiseIPTV-Mobile-*.apk || echo "Aucun APK trouvé"

      - name: Upload APK artifact (pour le job crash-test)
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          retention-days: 1

      - name: Upload Mobile APK artifact (release)
        uses: actions/upload-artifact@v4
        with:
          name: WiseIPTV-Mobile-${{ github.ref_name }}
          path: 'WiseIPTV-Mobile-*.apk'
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release — Mobile
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 'WiseIPTV-Mobile-*.apk'
          body: |
            ## Wise IPTV Mobile ${{ github.ref_name }}
            **APK Phone / Tablette Android**
            W Design — +240 555 445 514

            | Fichier | Usage |
            |---|---|
            | `*-debug.apk` | Tests & développement |
            | `*-release.apk` | Production (keystore requis) |

            ### Installation
            ```bash
            adb install WiseIPTV-Mobile-${{ github.ref_name }}-debug.apk
            ```

  # ── Job 2 : Test sur émulateur + capture logcat ───────────────────────────
  crash-test:
    runs-on: ubuntu-latest
    needs: build-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: apk-debug
          path: apk/

      - name: Enable KVM (accélération émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android Emulator + capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_3a
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            # Démarrer la capture logcat en arrière-plan
            adb logcat -c
            adb logcat > /tmp/logcat_full.txt 2>&1 &
            LOGCAT_PID=$!

            # Installer l'APK
            echo "=== Installation APK ==="
            adb install -r apk/mobile-debug.apk

            # Lancer l'ActivationActivity (premier écran)
            echo "=== Lancement de l'app ==="
            adb shell am start -n "com.wdesign.wiseiptv.mobile/.ui.ActivationActivity"
            sleep 8

            # Simuler le clic sur "Accéder au contenu" (btn_access)
            echo "=== Clic btn_access ==="
            adb shell input keyevent 66  # ENTER — ou tap coordonnées
            sleep 5

            # Simuler un retour arrière puis relance (test "cesse de fonctionner")
            echo "=== Test retour + relance ==="
            adb shell input keyevent 4   # BACK
            sleep 2
            adb shell am start -n "com.wdesign.wiseiptv.mobile/.ui.MainActivity"
            sleep 5

            # Arrêter logcat
            kill $LOGCAT_PID 2>/dev/null || true

            # Extraire uniquement les crashs et erreurs
            echo "=== CRASH / FATAL LOG ==="
            grep -E "FATAL|AndroidRuntime|EXCEPTION|Caused by|at com.wdesign" \
              /tmp/logcat_full.txt > /tmp/logcat_crash.txt || true
            cat /tmp/logcat_crash.txt

            # Vérifier s'il y a eu un crash
            if grep -q "FATAL EXCEPTION" /tmp/logcat_full.txt; then
              echo "❌ CRASH DÉTECTÉ"
              exit 1
            else
              echo "✅ Pas de crash détecté"
            fi

      - name: Upload logcat complet (toujours, même si pas de crash)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-${{ github.run_number }}
          path: |
            /tmp/logcat_full.txt
            /tmp/logcat_crash.txt
          retention-days: 7